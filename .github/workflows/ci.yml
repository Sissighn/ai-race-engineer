name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify imports
        run: |
          python -c "import fastf1, pandas, numpy, streamlit, pydantic, structlog"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=app/components \
            --cov=src.exceptions \
            --cov=src.config.settings \
            --cov=src/models \
            --cov=src.data.load_data \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-files
          path: |
            .coverage
            pytest.ini
            tests
          if-no-files-found: ignore
