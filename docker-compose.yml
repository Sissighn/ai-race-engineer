services:
  f1-live-timing:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-race-engineer:latest
    command: ["python", "-m", "src.services.live_timing_signalr.server"]
    ports:
      - "8765:8765"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      PYTHONPATH: /app
      HOME: /app
      XDG_CACHE_HOME: /app/cache/xdg
      XDG_DATA_HOME: /app/data/xdg
      F1_SIGNALR_ENABLED: "true"
      F1_SIGNALR_SERVICE_HOST: 0.0.0.0
      F1_SIGNALR_SERVICE_PORT: "8765"
      F1_SIGNALR_NO_AUTH: "true"
      F1_SIGNALR_RECONNECT_DELAY: "5"
      OPENF1_LIVE_ENABLED: "false"
      OPENF1_LIVE_POLL_INTERVAL: "18"
      OPENF1_LIVE_WINDOW_SECONDS: "45"
      OPENF1_MIN_REQUEST_INTERVAL: "2.1"

  ai-race-engineer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-race-engineer:latest
    ports:
      - "8501:8501"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      AI_RACE_ENGINEER_ROOT: /app
      AI_RACE_ENGINEER_CACHE_DIR: /app/cache
      AI_RACE_ENGINEER_DATA_DIR: /app/data
      AI_RACE_ENGINEER_LOGS_DIR: /app/logs
      AI_RACE_ENGINEER_ASSETS_DIR: /app/app/assets
      HOME: /app
      XDG_CACHE_HOME: /app/cache/xdg
      XDG_DATA_HOME: /app/data/xdg
      FASTF1_CACHE_ENABLED: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      LIVE_TIMING_SIGNALR_URL: http://f1-live-timing:8765
      LIVE_TIMING_BROWSER_SIGNALR_URL: http://localhost:8765
      LIVE_TIMING_SIGNALR_TIMEOUT: "2"
      OPENF1_MIN_REQUEST_INTERVAL: "2.1"
    volumes:
      - fastf1-cache:/app/cache
      - app-logs:/app/logs
    depends_on:
      - f1-live-timing

volumes:
  fastf1-cache:
  app-logs:
