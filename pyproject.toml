[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-race-engineer"
version = "0.1.0"
description = "Formula 1 telemetry analysis and race engineering insights"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Setayesh Golshan" }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
namespaces = true
